# Windows x64 online installer. Runtimes and models download directly from their
# upstream publishers; this repository does not host runtime bundles.
# 另出一份 clipforge-skill.zip（zip 根即 skill 文件夹，可直接上传 claude.ai 的 Skills 面板）。
name: Release Desktop

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # 创建 Release / 上传产物需要

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 配置与在线运行资源一致的 Node ABI
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm

      # 注意：这里【不】跳过 electron 二进制下载——打包需要它
      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验安装资源和桌面宿主
        run: pnpm test:desktop-runtime

      - name: 生成固定官方源清单及应用支持文件
        run: pnpm desktop:runtime

      - name: 校验官方源匿名下载地址
        run: pnpm desktop:verify-downloads

      - name: 打包轻量 Windows 在线安装器
        run: pnpm dist

      - name: 实测在线资源安装及打包后的普通 Node 后端
        run: pnpm desktop:smoke

      - name: 上传安装包到 Release（草稿，审核产物后再发布）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            artifacts/runtime/desktop-runtime-manifest.json
          fail_on_unmatched_files: true
          draft: true
          # 双语发布说明（中文优先 + 英文），国际化友好；品牌统一为 ClipForge、数据目录与 build.productName 一致
          body: |
            ClipForge Windows x64 客户端 —— 下载 `.exe` 开始在线安装。

            安装器自动下载并校验 Node、Kling CLI、ElevenLabs CLI、Python、音频对齐模型、本地 Tiny 转写模型及媒体工具，全部就绪后才完成安装。无需自行安装开发环境。模型不内置于安装包中，请保持网络连接并准备足够磁盘空间。

            安装后在设置页登录自己的 Kling / ElevenLabs 账号。关闭窗口可在托盘继续处理；彻底退出将停止本机任务。文件菜单可打开旧版本完整工作目录，设置页支持配置导入导出。

            安装资源直接来自 Node.js、Python、npm、PyPI、PyTorch、Hugging Face 等上游发行源，使用固定版本和 SHA256 校验；无需本仓库托管 CLI、Python 或模型包。macOS/Linux 在线运行资源待独立验收。

            ---

            ClipForge Windows x64 online installer downloads pinned Node, CLI, Python, model and media resources directly from their upstream publishers and verifies SHA256 checksums. Large resources are not embedded in the installer or hosted by this repository. Sign in to your own cloud accounts after setup.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Agent-skill bundle for claude.ai: the zip root must be the skill folder itself
  # (clipforge-video/SKILL.md), matching claude.ai's upload requirement.
  skill-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 打包 agent skill（clipforge-skill.zip + clipforge-script-judges.zip）
        run: |
          cd skills
          zip -r ../clipforge-skill.zip clipforge-video
          zip -r ../clipforge-script-judges.zip script-judges

      - name: 打包 MCP 安装包
        working-directory: mcp
        run: npm pack --ignore-scripts --pack-destination ..

      - name: 上传 Skill 与 MCP 安装包到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clipforge-skill.zip
            clipforge-script-judges.zip
            clipforge-mcp-*.tgz
          fail_on_unmatched_files: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
